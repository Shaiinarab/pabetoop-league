name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: test -z "$(gofmt -l . | grep -v '^vendor/')"

      - name: Test (race detector)
        run: go test -race ./...

      - name: Branding leak gate
        run: go test ./internal/web -run Legacy -v

      - name: Smoke-test the seed generator
        run: |
          go run ./cmd/seed --db /tmp/ci-seed.db --force
          test -s /tmp/ci-seed.db

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pabetoop-league:ci .
